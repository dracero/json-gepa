[project]
name = "langsmith-qa-dashboard-backend"
version = "0.1.0"
description = "Backend FastAPI para el LangSmith QA Dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic>=2.7.4",
    "pydantic-settings==2.2.1",
    "langsmith>=0.2.0",
    "python-dotenv==1.0.1",
    "langgraph>=0.1.18",
    "langchain-google-genai>=1.0.8",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "httpx==0.27.0",
    "hypothesis==6.100.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
